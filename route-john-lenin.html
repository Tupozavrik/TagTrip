        // Переменные для управления маршрутом

        let userMarker = null;
        
        // Данные маршрута для отслеживания прогресса (используем ТОЧНЫЕ координаты из оригинала)

        // Геолокация и отслеживание прогресса
        function updateUserPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // Обновляем или создаем маркер пользователя
            if (userMarker) {
                userMarker.setLatLng([lat, lon]);
            } else {
                const userIcon = L.AwesomeMarkers.icon({
                    extraClasses: "fa-rotate-0",
                    icon: "user",
                    iconColor: "white",
                    markerColor: "darkblue",
                    prefix: "fa"
                });
                
                userMarker = L.marker([lat, lon], { icon: userIcon })
                    .addTo(map_946c5598974d9a83d38ccf2622ee712b)
                    .bindPopup('👤 Ваше местоположение')
                    .bindTooltip('Вы здесь', {"sticky": true});
            }
            
            // Проверяем близость к точкам маршрута (если маршрут начат)
            if (routeStarted) {
                checkRouteProgress(lat, lon);
            }
        }
        
        function checkRouteProgress(userLat, userLon) {
            routePoints.forEach((point, index) => {
                if (point.visited) return;
                
                const distance = calculateDistance(userLat, userLon, point.lat, point.lon);
                
                // Если пользователь в радиусе 100 метров от точки
                if (distance < 0.1) {
                    point.visited = true;
                    
                    // Уведомление о достижении точки
                    if (window.telegramApp) {
                        window.telegramApp.hapticFeedback('success');
                        window.telegramApp.showAlert(`✅ Вы достигли: ${point.name}!`);
                    } else {
                        alert(`✅ Вы достигли: ${point.name}!`);
                    }
                    
                    // Проверяем, все ли точки пройдены
                    const allVisited = routePoints.every(p => p.visited);
                    if (allVisited) {
                        setTimeout(() => {
                            completeRoute();
                        }, 1500);
                    }
                }
            });
        }
        
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Радиус Земли в км
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }
        
        function startRoute() {
            routeStarted = true;

                window.telegramApp.hapticFeedback('medium');
                window.telegramApp.showAlert('🚀 Маршрут "Джон Ленин" начат! Направляйтесь к Омской крепости.');

            }
            
            // Изменяем кнопку
            const startBtn = document.querySelector('.start-btn');
            if (startBtn) {
                startBtn.innerHTML = '⏸️ Остановить';
                startBtn.onclick = stopRoute;
                startBtn.classList.remove('start-btn');
                startBtn.classList.add('stop-btn');
            }
            
            // Запрашиваем геолокацию
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    updateUserPosition,
                    (error) => console.warn('Ошибка геолокации:', error),
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 60000
                    }
                );
            }
        }
        
        function stopRoute() {
            routeStarted = false;
            
            if (window.telegramApp) {
                window.telegramApp.hapticFeedback('light');
                window.telegramApp.showAlert('⏸️ Маршрут остановлен.');
            }
            
            // Сбрасываем состояние точек
            routePoints.forEach(point => {
                point.visited = false;
            });
            
            // Возвращаем кнопку в исходное состояние
            const stopBtn = document.querySelector('.stop-btn');
            if (stopBtn) {
                stopBtn.innerHTML = '🚀 Начать маршрут';
                stopBtn.onclick = startRoute;
                stopBtn.classList.remove('stop-btn');
                stopBtn.classList.add('start-btn');
            }
        }
        
        function completeRoute() {
            routeStarted = false;
            
            if (window.telegramApp) {
                window.telegramApp.hapticFeedback('success');
                window.telegramApp.showAlert('🎉 Поздравляем! Маршрут "Джон Ленин" завершен!\n\n🎁 Ваш промокод: JOHNLENIN15\nИспользуйте в кофейне "Центральная"');
            } else {
                alert('🎉 Поздравляем! Маршрут завершен!\n\nВаш промокод: JOHNLENIN15');
            }
            
            // Обновляем статистику
            const stats = JSON.parse(localStorage.getItem('tagtrip_stats') || '{"routesCompleted": 0, "distanceWalked": 0, "rewardsEarned": 0}');
            stats.routesCompleted++;
            stats.distanceWalked += 2.5;
            stats.rewardsEarned++;
            
            // Сохраняем новую награду
            if (!stats.unlockedRewards) stats.unlockedRewards = [];
            stats.unlockedRewards.push({
                id: 'johnlenin15',
                code: 'JOHNLENIN15',
                partner: 'Кофейня "Центральная"',
                discount: '15%',
                routeName: 'Джон Ленин',
                unlockedAt: new Date().toISOString(),
                used: false,
                type: 'coffee'
            });
            
            localStorage.setItem('tagtrip_stats', JSON.stringify(stats));
            
            // Возвращаем кнопку в исходное состояние
            const stopBtn = document.querySelector('.stop-btn');
            if (stopBtn) {
                stopBtn.innerHTML = '🚀 Начать заново';
                stopBtn.onclick = startRoute;
                stopBtn.classList.remove('stop-btn');
                stopBtn.classList.add('start-btn');
            }
        }
        
        function goBack() {
            if (window.telegramApp) {
                window.telegramApp.hapticFeedback('light');
                window.telegramApp.goBack();
            } else {
                window.history.back();
            }
        }
        
        // Навигационные функции
        function goHome() {
            window.location.href = 'index.html';
        }
        
        function openRoutes() {
            window.location.href = 'routes.html';
        }
        
        function openMap() {
            // Уже на странице карты
            if (window.telegramApp) {
                window.telegramApp.hapticFeedback('light');
            }
        }
        
        function openRewards() {
            window.location.href = 'rewards.html';
        }
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Карта маршрута "Джон Ленин" загружена с оригинальными настройками');
            
            // Применяем темную тему если нужно
            if (window.telegramApp && window.telegramApp.tg.colorScheme === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
            }
        });
    </script>
</body>
</html>
